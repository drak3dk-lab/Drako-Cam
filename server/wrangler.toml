# Servidor de acceso de Drako Cam.
# La URL pública y el database_id no son secretos.
# El token del bot, el chat id, el secreto del webhook y la semilla
# de firma NO van aquí: se guardan con `npx wrangler secret put`.

name = "drako-cam-licencias"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "drako-cam-licencias"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
GRACIA_HORAS = "24"
LATIDO_SEGUNDOS = "60"
SESION_ACTIVA_SECS = "180"
